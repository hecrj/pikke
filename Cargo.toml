[package]
name = "pikke"
version = "0.1.0"
edition = "2024"
description = "A modern, Lua-driven image and video compositing engine"

[features]
multithreading = []

[dependencies]
log = "0.4"
notify = "8"
png = "0.18"
rayon = "1"
serde_json = "1"
thiserror = "2"

fontique = { version = "0.12", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "error-send"] }
parley = { version = "0.12", default-features = false, features = ["std"] }
parlance = { version = "0.1", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "u8_pipeline"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "lua"
harness = false

[lints.clippy]
too_many_arguments = "allow"
